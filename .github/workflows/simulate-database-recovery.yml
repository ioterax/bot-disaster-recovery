name: Simulate - Database recovery

on:
  workflow_call:
    inputs:
      restore_target: { required: true, type: string }
      recovery_point_age_minutes: { required: true, type: string }
      confirmation: { required: true, type: string }
  workflow_dispatch:
    inputs:
      restore_target:
        description: New instance; must end with -dr-restore
        required: true
        default: ioterax-database-dr-restore
        type: string
      recovery_point_age_minutes:
        description: Synthetic PITR/backup age
        required: true
        default: "5"
        type: string
      confirmation:
        description: Type SIMULATE to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DR_CONFIRMATION: ${{ inputs.confirmation }}
      DR_RECOVERY_POINT_AGE_MINUTES: ${{ inputs.recovery_point_age_minutes }}
      DR_TARGET: ${{ inputs.restore_target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26.6.0 }
      - name: Enforce restore and RPO guardrails
        run: |
          node --run check:runtime
          test "$DR_CONFIRMATION" = "SIMULATE" || { echo "confirmation must equal SIMULATE" >&2; exit 1; }
          [[ "$DR_TARGET" =~ -dr-restore$ ]] || { echo "source overwrite forbidden: target must end with -dr-restore" >&2; exit 1; }
          [[ "$DR_RECOVERY_POINT_AGE_MINUTES" =~ ^[0-9]+$ ]] || { echo "recovery point age must be a non-negative integer" >&2; exit 1; }
          (( DR_RECOVERY_POINT_AGE_MINUTES <= 15 )) || { echo "recovery point exceeds RPO" >&2; exit 1; }
      - name: Simulate backup catalog and integrity checks
        run: |
          sleep 3
          echo "PITR/backup, encryption, region and checksum validated synthetically."
      - name: Simulate isolated database restore
        run: |
          sleep 3
          echo "Restored to a new synthetic instance; source was not overwritten."
      - name: Simulate data validation
        run: |
          sleep 3
          echo "Connectivity, schema checksum and read-only query validated."
