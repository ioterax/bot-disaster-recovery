name: Simulate - Database recovery

on:
  workflow_call:
    inputs:
      restore_target: { required: true, type: string }
      recovery_point_age_minutes: { required: true, type: string }
      confirmation: { required: true, type: string }
  workflow_dispatch:
    inputs:
      restore_target:
        description: New instance; must end with -dr-restore
        required: true
        default: sample-database-dr-restore
        type: string
      recovery_point_age_minutes:
        description: Synthetic PITR/backup age
        required: true
        default: "5"
        type: string
      confirmation:
        description: Type SIMULATE to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DR_CONFIRMATION: ${{ inputs.confirmation }}
      DR_SCENARIO: database-recovery
      DR_TARGET: ${{ inputs.restore_target }}
      DR_RECOVERY_POINT_AGE_MINUTES: ${{ inputs.recovery_point_age_minutes }}
      DR_TARGET_RPO_MINUTES: "15"
      DR_PHASES: backup-catalog,rpo-gate,encryption-and-checksum,isolated-restore,connectivity,schema-checksum,read-only-query
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26.6.0 }
      - name: Run deterministic database simulation
        run: |
          node --run check:runtime
          node scripts/simulate-recovery.mjs
      - name: Publish database evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dr-evidence-database-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/database-recovery.json
          if-no-files-found: error
          retention-days: 30
