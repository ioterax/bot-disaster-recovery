name: Simulate - FluxCD bootstrap

on:
  workflow_call:
    inputs:
      gitops_path: { required: true, type: string }
      confirmation: { required: true, type: string }
  workflow_dispatch:
    inputs:
      gitops_path:
        description: Repository-relative GitOps path
        required: true
        default: clusters/recovery
        type: string
      confirmation:
        description: Type SIMULATE to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  flux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DR_GITOPS_PATH: ${{ inputs.gitops_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26.6.0 }
      - name: Enforce GitOps guardrails
        run: |
          node --run check:runtime
          test "${{ inputs.confirmation }}" = "SIMULATE" || { echo "confirmation must equal SIMULATE" >&2; exit 1; }
          [[ "$DR_GITOPS_PATH" != /* && "$DR_GITOPS_PATH" != *..* ]] || { echo "unsafe GitOps path" >&2; exit 1; }
      - name: Simulate bootstrap at an immutable revision
        run: |
          sleep 3
          echo "Flux controllers and immutable Git source bootstrapped synthetically."
      - name: Simulate reconciliation and workload health
        run: |
          sleep 3
          echo "Kustomizations, Helm releases and workloads converged."

