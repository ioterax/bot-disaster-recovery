name: Simulate - FluxCD bootstrap

on:
  workflow_call:
    inputs:
      gitops_path: { required: true, type: string }
      confirmation: { required: true, type: string }
  workflow_dispatch:
    inputs:
      gitops_path:
        description: Repository-relative GitOps path
        required: true
        default: clusters/recovery
        type: string
      confirmation:
        description: Type SIMULATE to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  flux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DR_CONFIRMATION: ${{ inputs.confirmation }}
      DR_SCENARIO: flux-bootstrap
      DR_GITOPS_PATH: ${{ inputs.gitops_path }}
      DR_PHASES: cluster-readiness,immutable-revision,controller-install,source-ready,kustomizations,helm-releases,workload-health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26.6.0 }
      - name: Run deterministic FluxCD simulation
        run: |
          node --run check:runtime
          node scripts/simulate-recovery.mjs
      - name: Publish FluxCD evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dr-evidence-flux-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/flux-bootstrap.json
          if-no-files-found: error
          retention-days: 30
