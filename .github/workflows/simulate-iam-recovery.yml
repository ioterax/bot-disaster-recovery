name: Simulate - IAM recovery

on:
  workflow_call:
    inputs:
      snapshot_age_minutes: { required: true, type: string }
      confirmation: { required: true, type: string }
  workflow_dispatch:
    inputs:
      snapshot_age_minutes:
        description: Synthetic snapshot age
        required: true
        default: "5"
        type: string
      confirmation:
        description: Type SIMULATE to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  iam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DR_CONFIRMATION: ${{ inputs.confirmation }}
      DR_SCENARIO: iam-recovery
      DR_SNAPSHOT_AGE_MINUTES: ${{ inputs.snapshot_age_minutes }}
      DR_TARGET_RPO_MINUTES: "15"
      DR_PHASES: snapshot-catalog,rpo-gate,normalize-bindings,exclude-private-keys,kms-integrity,dependency-order,synthetic-restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26.6.0 }
      - name: Run deterministic IAM simulation
        run: |
          node --run check:runtime
          node scripts/simulate-recovery.mjs
      - name: Publish IAM evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dr-evidence-iam-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/iam-recovery.json
          if-no-files-found: error
          retention-days: 30
