name: Simulate - Terraform drift

on:
  workflow_call:
    inputs:
      scenario: { required: true, type: string }
      confirmation: { required: true, type: string }
  workflow_dispatch:
    inputs:
      scenario:
        description: Synthetic Terraform event
        required: true
        default: resource-deleted
        type: choice
        options: [resource-deleted, resource-modified, state-unavailable]
      confirmation:
        description: Type SIMULATE to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DR_CONFIRMATION: ${{ inputs.confirmation }}
      DR_SCENARIO: terraform-drift
      DR_TERRAFORM_SCENARIO: ${{ inputs.scenario }}
      DR_PHASES: immutable-source,backend-metadata,refresh-only-plan,change-classification,policy-evaluation,evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26.6.0 }
      - name: Run deterministic Terraform simulation
        run: |
          node --run check:runtime
          node scripts/simulate-recovery.mjs
      - name: Publish Terraform evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dr-evidence-terraform-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/terraform-drift.json
          if-no-files-found: error
          retention-days: 30
