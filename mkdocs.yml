site_name: StormHarbor
site_description: Continuous recovery readiness for Terraform, Google Cloud, Kubernetes and GitOps
site_url: https://ferreiraad.github.io/disaster-recovery-control-plane/
repo_url: https://github.com/ferreiraad/disaster-recovery-control-plane
repo_name: ferreiraad/disaster-recovery-control-plane
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: dr-light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: dr-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Usar tema claro
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - Visão geral:
      - Início: index.md
      - Produto: product/overview.md
      - Terminologia: product/glossary.md
  - Arquitetura:
      - Control plane: architecture/control-plane.md
      - Federated Source of Truth: architecture/federated-source-of-truth.md
      - Inventário e dependências: architecture/inventory.md
      - AI providers: architecture/ai-providers.md
      - Segurança: architecture/security.md
  - Kubernetes:
      - CRDs e Operator: kubernetes/crds-and-operator.md
  - Operações:
      - Pipelines de simulação: operations/pipelines.md
      - RTO, RPO e evidências: operations/evidence.md
      - Configuração: configuration.md
  - Evolução:
      - Roadmap: roadmap.md
      - Sobre o projeto: about.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: joint
          class: joint-diagram-source
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - pt
        - en
  - minify:
      minify_html: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/@joint/core@4.3.0/dist/joint.js
  - javascripts/joint-diagrams.js
  - javascripts/navigation-toggle.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ferreiraad/disaster-recovery-control-plane
      name: Repositório no GitHub
  status:
    simulation: Simulação segura

copyright: Documentação do StormHarbor
